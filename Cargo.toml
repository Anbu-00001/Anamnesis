[package]
name = "anamnesis"
version = "0.4.2"
edition = "2021"
# File::lock (src/store.rs) is std as of 1.89.
rust-version = "1.89"
description = "A local-first instrument against self-deception: log what you believe and how sure, then face the real shape of your mind."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Anbu-00001/Anamnesis"
homepage = "https://github.com/Anbu-00001/Anamnesis"
keywords = ["calibration", "forecasting", "brier-score", "decision-making", "cli"]
categories = ["command-line-utilities", "science"]
# An allowlist, not an exclude list: the crate is the engine and its CLI. The plugin,
# the launch notes, the validation scripts and the test suite (which reads ../plugin/)
# stay in the repository. Anything added here ships to crates.io for good.
include = [
    "src/**",
    "examples/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
]

[[bin]]
name = "ana"
path = "src/main.rs"

[lib]
name = "anamnesis"
path = "src/lib.rs"

[[example]]
name = "seed"
path = "examples/seed.rs"

[[example]]
name = "audit"
path = "examples/audit.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }

[profile.release]
opt-level = 2
