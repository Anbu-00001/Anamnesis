name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The concurrency and path handling differ per platform, and both have
        # been wrong before: `File::lock` is flock here and LockFileEx there, and
        # the ledger path used to read $HOME only, which silently gave every
        # folder on Windows its own ledger.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --all-features -- -D warnings
      # Runs the suite AND pins how many tests ran: a test that silently stops
      # running is indistinguishable from one that passes. See the script header.
      - name: Test (with test-count floor)
        run: ./scripts/check-test-count.sh
      - name: Doc tests
        run: cargo test --doc

  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `File::lock` (src/store.rs) is std from 1.89, and that floor is a promise
      # in Cargo.toml, so it is checked rather than assumed.
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo check --all-targets --locked

  versions:
    name: one version, three files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-versions.sh

  examples:
    name: generated output is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Demo works from a cold start
        run: |
          cargo run --quiet -- demo | grep -q "shape of your judgement"
          cargo run --quiet -- where
      - name: README examples are not stale
        run: |
          ./scripts/regen-examples.sh
          git diff --exit-code -- README.md \
            || { echo "README examples are stale — run scripts/regen-examples.sh"; exit 1; }
