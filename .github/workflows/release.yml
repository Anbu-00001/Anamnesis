name: release

# Build prebuilt `ana` binaries for every platform on a version tag, and attach
# them to the GitHub Release. The Claude Code plugin and `install-ana.sh` fetch
# these, so users never need a Rust toolchain.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          # Statically linked, so it runs on distros whose glibc is older than
          # the runner's — the single most common "it won't start" report.
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu }
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cross linker for aarch64 linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --bin ana --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          ext=""; [ "${{ matrix.os }}" = "windows-latest" ] && ext=".exe"
          name="ana-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ana${ext}" "dist/${name}${ext}"
          ( cd dist && { sha256sum "${name}${ext}" 2>/dev/null || shasum -a 256 "${name}${ext}"; } > "${name}.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  # One `sha256.sum` for the whole release: `install-ana.sh` verifies against it
  # and fails closed if it is missing, so it must always be published.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect and checksum
        shell: bash
        run: |
          mkdir -p dist
          find staging -type f ! -name '*.sha256' -exec cp {} dist/ \;
          ( cd dist && sha256sum * > sha256.sum )
          cat dist/sha256.sum

      - uses: softprops/action-gh-release@v2
        with:
          # A `-rc` tag must not become "latest": the README's install line
          # fetches releases/latest, and a release candidate is not what a
          # visitor should get.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*

  # Every install path the README documents, on a clean machine of each OS,
  # against THIS release. The previous version of this job ran
  # `cargo install --path .`, which touches neither the published binaries nor
  # the installer the README tells people to run, so it could pass while every
  # documented install line was broken.
  smoke:
    name: smoke (${{ matrix.os }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Prebuilt binary via install-ana.sh, pinned to this tag
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash plugin/install-ana.sh "$TAG"
          want="${TAG#v}"; want="${want%%-*}"
          got="$("$HOME/.anamnesis/bin/ana" --version)"
          [ "$got" = "ana $want" ] || { echo "installed '$got', expected 'ana $want'"; exit 1; }
          "$HOME/.anamnesis/bin/ana" demo > /dev/null

      - name: The README's prebuilt install line, exactly as written
        if: runner.os != 'Windows' && !contains(github.ref_name, '-')
        shell: bash
        run: |
          rm -rf "$HOME/.anamnesis/bin"
          bash <(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/plugin/install-ana.sh")
          [ "$("$HOME/.anamnesis/bin/ana" --version)" = "ana ${TAG#v}" ]

      - name: Prebuilt Windows binary, checksum-verified
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $base = "https://github.com/${{ github.repository }}/releases/download/$env:TAG"
          $asset = "ana-x86_64-pc-windows-msvc.exe"
          Invoke-WebRequest "$base/$asset" -OutFile ana.exe
          Invoke-WebRequest "$base/sha256.sum" -OutFile sha256.sum
          $line = Select-String -Path sha256.sum -Pattern ([regex]::Escape($asset) + '$') | Select-Object -First 1
          if (-not $line) { throw "sha256.sum does not list $asset" }
          $want = $line.Line.Split(' ')[0]
          $got = (Get-FileHash ana.exe -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "checksum mismatch: expected $want, got $got" }
          ./ana.exe --version
          ./ana.exe demo | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "ana demo failed" }

      - uses: dtolnay/rust-toolchain@stable

      - name: From source, as the README's first install line does
        shell: bash
        run: |
          cargo install --git "https://github.com/${{ github.repository }}" --tag "$TAG" --locked
          ana --version
          ana demo > /dev/null
